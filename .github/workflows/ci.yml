name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: chat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chat -d chat"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: test
      JWT_SECRET: ci-test-secret-with-at-least-32-characters
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_POSTGRES_URL: postgresql+asyncpg://chat:chat@localhost:5432/chat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests/test_*.py tests/conftest.py tests/celery_reports_test.py tests/process_helpers.py migrations
      - run: python -m ruff format --check app tests/test_*.py tests/conftest.py tests/celery_reports_test.py tests/process_helpers.py migrations
      - run: python -m pytest -q
      - run: python -m pip_audit -r requirements.txt --no-deps --disable-pip --progress-spinner off
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait
      - run: curl --fail http://localhost:8000/ready
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
