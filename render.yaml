# This Blueprint provisions PAID services. Review pricing before applying.
services:
- type: keyvalue
  name: realtime-chat-redis
  plan: starter
  ipAllowList: []
  maxmemoryPolicy: noeviction
- type: web
  name: realtime-chat
  runtime: docker
  plan: starter
  dockerfilePath: ./Dockerfile
  healthCheckPath: /ready
  preDeployCommand: python -m alembic upgrade head
  envVars:
  - fromGroup: realtime-chat-config
  - key: DATABASE_URL
    fromDatabase:
      name: realtime-chat-db
      property: connectionString
  - key: REDIS_URL
    fromService:
      name: realtime-chat-redis
      type: keyvalue
      property: connectionString
  - key: CELERY_BROKER_URL
    fromService:
      name: realtime-chat-redis
      type: keyvalue
      property: connectionString
  - key: CELERY_RESULT_BACKEND
    fromService:
      name: realtime-chat-redis
      type: keyvalue
      property: connectionString
- type: worker
  name: realtime-chat-worker
  runtime: docker
  plan: starter
  dockerfilePath: ./Dockerfile
  dockerCommand: python -m celery -A app.celery_app:celery_app worker --loglevel=INFO
    --concurrency=2
  envVars:
  - fromGroup: realtime-chat-config
  - key: DATABASE_URL
    fromDatabase:
      name: realtime-chat-db
      property: connectionString
  - key: REDIS_URL
    fromService:
      name: realtime-chat-redis
      type: keyvalue
      property: connectionString
  - key: CELERY_BROKER_URL
    fromService:
      name: realtime-chat-redis
      type: keyvalue
      property: connectionString
  - key: CELERY_RESULT_BACKEND
    fromService:
      name: realtime-chat-redis
      type: keyvalue
      property: connectionString
databases:
- name: realtime-chat-db
  plan: basic-256mb
  databaseName: chat
  user: chat
  ipAllowList: []
envVarGroups:
- name: realtime-chat-config
  envVars:
  - key: ENVIRONMENT
    value: production
  - key: AUTO_CREATE_DB
    value: 'false'
  - key: JWT_SECRET
    generateValue: true
  - key: REDIS_NAMESPACE
    value: realtime-chat
